name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: engineering_graph
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: egp_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      neo4j:
        image: neo4j:community
        env:
          NEO4J_AUTH: neo4j/egp_neo4j
        ports:
          - 7474:7474
          - 7687:7687
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      minio:
        image: minio/minio
        env:
          MINIO_ROOT_USER: minio
          MINIO_ROOT_PASSWORD: egp_minio
        ports:
          - 9000:9000
          - 9001:9001
        command: server /data --console-address ":9001"
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Lint with Ruff
        run: |
          ruff check .

      - name: Run Pytest Integration Suite
        env:
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_DB: engineering_graph
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: egp_password
          POSTGRES_PORT: 5432
          NEO4J_HOST: 127.0.0.1
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: egp_neo4j
          NEO4J_PORT: 7687
          MINIO_HOST: 127.0.0.1
          MINIO_ROOT_USER: minio
          MINIO_ROOT_PASSWORD: egp_minio
          MINIO_PORT: 9000
        run: |
          pytest